<svg xmlns="http://www.w3.org/2000/svg" viewBox="170 335 500 500" width="100%" height="100%">
  <defs>
    <filter id="fav-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="12" flood-color="#000000" flood-opacity="0.45" />
    </filter>
  </defs>

  <!-- Background container for high contrast in light & dark browser tabs -->
  <rect x="170" y="335" width="500" height="500" rx="90" fill="#080808" />

  <!-- Pure White Solid Studio Geometric Mark -->
  <g filter="url(#fav-shadow)">
    <!-- Top Left Elements -->
    <rect x="200" y="365" width="33.48" height="237.24" fill="#ffffff" />
    <rect x="293.24" y="365" width="33.60" height="35.88" fill="#ffffff" />
    <rect x="293.24" y="468.08" width="33.60" height="134.16" fill="#ffffff" />

    <!-- Top Right Horizontal Bars -->
