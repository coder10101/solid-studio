    <rect x="385.64" y="468.08" width="269.28" height="33.60" fill="#ffffff" />
    <rect x="385.64" y="568.52" width="174.36" height="33.72" fill="#ffffff" />

    <!-- Right Vertical Bar -->
    <rect x="620.6" y="568.52" width="33.60" height="237.24" fill="#ffffff" />

    <!-- Bottom Left Horizontal Bars -->
    <rect x="199.04" y="670.52" width="269.28" height="33.60" fill="#ffffff" />
    <rect x="199.04" y="771.2" width="269.28" height="33.60" fill="#ffffff" />

    <!-- Bottom Right Squares -->
    <rect x="526.4" y="670.52" width="33.60" height="32.16" fill="#ffffff" />
