<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Solid Studio — 16:9 Video Outro (1920x1080)</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --ink: #171613;
      --paper: #f1efe8;
      --line: #cbc7bc;
      --oxblood: #701419;
      --sans: "Montserrat", sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: #000;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      font-family: var(--sans);
      overflow: hidden;
    }

    /* 16:9 Aspect Ratio Container */
    .viewport-16x9 {
      width: 100vw;
      height: 56.25vw; /* 16:9 */
      max-height: 100vh;
      max-width: 177.78vh; /* 16:9 */
      background: var(--paper);
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .intro__logo-wrap {
      align-items: center;
      display: flex;
      flex-direction: column;
      gap: 32px;
      width: 260px;
    }

    .intro__logo-wrap img {
      animation: logoReveal 1.25s cubic-bezier(.22, 1, .36, 1) forwards;
      clip-path: inset(100% 0 0);
      opacity: 0;
      transform: translateY(22px);
      width: 100%;
      height: auto;
    }

    .intro__line {
      background: var(--line);
      display: block;
      height: 1.5px;
      overflow: hidden;
      position: relative;
      width: 100%;
    }

    .intro__line::after {
      animation: lineTravel 1.35s cubic-bezier(.65, 0, .35, 1) .5s forwards;
      background: var(--oxblood);
      content: "";
      inset: 0;
      position: absolute;
      transform: translateX(-101%);
    }

    .intro__label {
      animation: labelReveal .7s ease 1.1s forwards;
      bottom: 60px;
      font-size: 13px;
      font-weight: 500;
      left: 50%;
      letter-spacing: .24em;
      opacity: 0;
      position: absolute;
      text-transform: uppercase;
      transform: translateX(-50%);
      white-space: nowrap;
      color: var(--ink);
    }

    @keyframes logoReveal {
      0% {
        clip-path: inset(100% 0 0);
        opacity: 0;
        transform: translateY(22px);
      }
      100% {
        clip-path: inset(0);
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes lineTravel {
      0% {
        transform: translateX(-101%);
      }
      50% {
        transform: translateX(0);
      }
      100% {
        transform: translateX(101%);
      }
    }

    @keyframes labelReveal {
      to {
        opacity: 1;
      }
    }

    .replay-btn {
      position: fixed;
      bottom: 20px;
      right: 20px;
      background: rgba(23, 22, 19, 0.8);
      color: #fff;
      border: 1px solid #444;
      padding: 8px 16px;
      font-family: var(--sans);
      font-size: 11px;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      border-radius: 20px;
      cursor: pointer;
      z-index: 100;
      backdrop-filter: blur(8px);
    }
  </style>
</head>
<body>
  <div class="viewport-16x9" id="screen">
    <div class="intro__logo-wrap">
      <img src="src/assets/solid-studio-logo.svg" alt="Solid Studio" id="logoImg" />
      <span class="intro__line"></span>
    </div>
  </div>

  <button class="replay-btn" onclick="replay()">↺ Replay</button>

  <script>
    function replay() {
      const screen = document.getElementById('screen');
      const clone = screen.cloneNode(true);
      screen.parentNode.replaceChild(clone, screen);
    }
  </script>
</body>
</html>
